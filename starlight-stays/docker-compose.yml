services:
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    restart: always

  logstash:
    image: logstash:8.13.4
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "5000:5000"
    depends_on:
      - elasticsearch
    restart: always

  kibana:
    image: kibana:8.13.4
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    restart: always

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: always

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: always

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: always

  config-server:
    build: ./config-server
    container_name: config-server
    command:
      - java
      - -jar
      - app.jar
      - --spring.profiles.active=native
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      - JWT_SECRET=${JWT_SECRET:-StarlightStaysSuperSecretKeyForJwtValidation2026}
    depends_on:
      - discovery-server
    restart: always

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-StarlightStaysSuperSecretKeyForJwtValidation2026}
    depends_on:
      - discovery-server
      - config-server
      - redis
    restart: always

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=${JWT_SECRET:-StarlightStaysSuperSecretKeyForJwtValidation2026}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: always

  room-service:
    build: ./room-service
    container_name: room-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: always

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: always

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: always

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      discovery-server:
        condition: service_started
    restart: always

  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: always

  concierge-service:
    build: ./concierge-service
    container_name: concierge-service
    ports:
      - "8087:8087"
    depends_on:
      discovery-server:
        condition: service_started
    restart: always

  chat-service:
    build: ./chat-service
    container_name: chat-service
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: always

  addon-service:
    build: ./addon-service
    container_name: addon-service
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: always

