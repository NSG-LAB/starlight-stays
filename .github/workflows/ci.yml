name: Starlight Stays CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    name: Backend Microservices Reactor Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build All 9 Microservices with Maven
        working-directory: ./starlight-stays
        run: |
          mvn -B clean package -DskipTests

      - name: Verify Microservice Artifacts
        run: |
          ls -lh starlight-stays/*/target/*.jar

  frontend-build:
    name: Modern SPA Frontend Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite SPA Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify Dist Bundle
        run: |
          ls -lh frontend/dist/

  docker-compose-validate:
    name: Docker Compose Mesh Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        working-directory: ./starlight-stays
        run: |
          docker compose config

  script-syntax-audit:
    name: Operational Shell Scripts Syntax Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint Shell Scripts
        run: |
          bash -n start-all.sh
          bash -n stop-all.sh
          bash -n starlight-stays/comprehensive-system-test.sh
          bash -n starlight-stays/chaos-resilience-test.sh
          echo "All operational automation scripts passed syntax verification."
